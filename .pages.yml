  - name: research
    label: Направления исследований
    type: collection
    path: src/content/research
    format: json
    filename: "{fields.id}.json"
    view:
      primary: title_ru
      fields:
        - id
        - title_ru
        - publish
        - ready_ru
        - ready_en
    fields:
      - &a1
        name: id
        label: Постоянный ID
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Постоянный ID. Не менять после первого выпуска.
      - &a2
        name: slug
        label: Адрес страницы (slug)
        type: string
        required: true
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      - &a3
        name: publish
        label: Показывать на сайте
        type: boolean
        default: false
        description: Публично только при готовности обоих языков. Черновики видны в
