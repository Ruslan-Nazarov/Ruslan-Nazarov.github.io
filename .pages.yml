# Pages CMS. Source graph and immutable IDs are deliberately outside editorial control.
media:
  - name: library
    label: Медиабиблиотека
    input: public/media
    output: /media
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - svg
      - gif
  - name: images
    label: Images
    input: public/images
    output: /images
  - name: files
    label: PDF / Files
    input: public/files
    output: /files
actions:
  - name: release-content
    label: Сохранить полные RU+EN версии перед новой редакцией
    workflow: content-release.yml
content:
