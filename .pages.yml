  - name: sections
    label: Страницы разделов
    type: file
    path: src/data/sections.json
    format: json
    fields:
      - name: research
        label: research
        type: object
        fields:
          - &a1
            name: id
            label: Постоянный ID
            type: string
            required: true
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            description: Постоянный ID. Не менять после первого выпуска.
          - &a2
            name: slug
            label: Адрес страницы (slug)
            type: string
            required: true
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - &a3
            name: showInMenu
            label: Добавить страницу в меню
            type: boolean
          - &a4
            name: materials
            label: materials
            type: object
            list: true
            fields:
              - name: collection
                label: collection
                type: string
              - name: id
                label: Постоянный ID
                type: string
          - &a5
            name: excludedMaterials
            label: excludedMaterials
            type: string
            list: true
          - &a6
            name: hiddenMaterials
            label: hiddenMaterials
            type: object
            list: true
            fields:
              - name: collection
                label: collection
                type: string
              - name: id
                label: Постоянный ID
                type: string
          - &a7
            name: publish
            label: Показывать на сайте
            type: boolean
            default: false
            description: Публично только при готовности обоих языков. Черновики видны в
              исходном GitHub, но не на сайте.
          - &a8
            name: ready_ru
            label: Русская версия готова
            type: boolean
            default: false
          - &a9
            name: ready_en
            label: English version ready
            type: boolean
            default: false
          - &a10
            name: title_ru
            label: Заголовок · RU
            type: string
          - &a11
            name: title_en
            label: Title · EN
            type: string
          - &a12
            name: summary_ru
            label: Краткое описание · RU
            type: text
          - &a13
            name: summary_en
            label: Summary · EN
            type: text
          - &a14
            name: body_ru
            label: Текст · RU
            type: rich-text
          - &a15
            name: body_en
            label: Text · EN
            type: rich-text
          - &a16
            name: editorialStatus
            label: Готовность текста
            type: select
            options:
              values:
                - awaiting_content
                - editorial_summary
                - final
                - external_publication
            default: awaiting_content
          - &a17
            name: featured
            label: Избранный материал
            type: boolean
          - &a18
            name: order
            label: Порядок отображения
            type: number
            default: 100
          - &a19
            name: heroImage
            label: Обложка
            type: image
            options:
              media: library
          - &a20
            name: gallery
            label: Галерея
            type: object
            list: true
            fields:
              - name: src
                label: src
                type: image
                options:
                  media: library
              - name: alt_ru
                label: Описание изображения · RU
                type: string
                description: Описание для этого места в галерее. Подпись под изображением
                  берётся из медиабиблиотеки, если заполнена.
              - name: alt_en
                label: Описание изображения · EN
                type: string
                description: Описание для этого места в галерее. Подпись под изображением
                  берётся из медиабиблиотеки, если заполнена.
          - &a21
            name: researchAreas
            label: Направления (ID)
            type: string
            list: true
          - &a22
            name: relatedProjects
            label: Связанные проекты (ID)
            type: string
            list: true
          - &a23
            name: relatedPublications
            label: Связанные публикации (ID)
            type: string
            list: true
          - &a24
            name: relatedJournal
            label: Связанные записи дневника (ID)
            type: string
            list: true
          - &a25
            name: tags
            label: Теги
            type: string
            list: true
          - &a26
            name: links
            label: Внешние ссылки
            type: object
            list: true
            fields:
              - name: label_ru
                label: Название ссылки · RU
                type: string
              - name: label_en
                label: Link title · EN
                type: string
              - name: url
                label: url
                type: string
          - &a27
            name: exampleLinks
            label: exampleLinks
            type: object
            list: true
            fields:
              - name: id
                label: Постоянный ID
                type: string
              - name: label_ru
                label: Название ссылки · RU
                type: string
              - name: label_en
                label: Link title · EN
                type: string
              - name: url_ru
                label: url_ru
                type: string
              - name: url_en
                label: url_en
                type: string
          - &a28
            name: timeline
            label: События проекта
            type: object
            list: true
            fields:
              - name: date
                label: Дата публикации / события
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
              - name: title_ru
                label: Заголовок · RU
                type: string
              - name: title_en
                label: Title · EN
                type: string
          - &a29
            name: date
            label: Дата публикации / события
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
            description: Только реальная дата события или публикации. Оставить пустым, если
              неизвестна.
